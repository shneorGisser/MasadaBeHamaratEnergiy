[project]
name = "virtual-energy-lab"
version = "0.1.0"
description = "Virtual Energy Lab — engineering simulation backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "numpy>=2.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "httpx", "httpx2", "ruff", "mypy"]
postgres = ["psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ngspice: cross-validation tests that require the ngspice binary"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N802", "N803", "N806", "N815", "N816"]  # engineering symbols (U1, I0, Xm) are intentional

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["vel"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
vel = ["services/*.html", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
