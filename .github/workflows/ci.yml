name: CI
on: [push, pull_request]

# Each gate stage is its own step, so a failure is visible by name; on failure the tail of the
# stage's output is also published as an error annotation (readable from the API and the PR).
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: System packages (ngspice is the independent cross-validation oracle)
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Python env
        run: python -m venv .venv && .venv/bin/pip install -e 'backend[dev]'
      - name: Frontend deps
        run: cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Backend lint
        run: scripts/ci-step.sh backend-lint "cd backend && ../.venv/bin/ruff check vel tests && ../.venv/bin/ruff format --check vel tests"
      - name: Backend types
        run: scripts/ci-step.sh backend-types "cd backend && ../.venv/bin/mypy"
      - name: Backend tests
        run: scripts/ci-step.sh backend-tests "cd backend && ../.venv/bin/pytest -ra"
      - name: Frontend lint + types + unit tests
        run: scripts/ci-step.sh frontend-checks "cd frontend && npm run -s lint && npm run -s typecheck && npm test --silent"
      - name: Frontend build
        run: scripts/ci-step.sh frontend-build "cd frontend && npm run -s build"
      - name: End-to-end tests
        env: { PW_CHROMIUM: /nonexistent }
        run: scripts/ci-step.sh e2e "cd frontend && npx playwright test"

  # The deployable artifact itself: build the production image and smoke-test it against a
  # real PostgreSQL 16 (as on Cloud SQL) — migrations, a simulation, a report and its Word export.
  container:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vel, POSTGRES_PASSWORD: vel, POSTGRES_DB: vel }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vel" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t virtual-energy-lab .
      - name: Run container (PostgreSQL)
        run: |
          docker run -d --name vel --network host -e PORT=8080 \
            -e VEL_DATABASE_URL=postgresql+psycopg://vel:vel@127.0.0.1:5432/vel virtual-energy-lab
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/health
      - name: Smoke test
        run: bash scripts/smoke-container.sh http://127.0.0.1:8080
      - name: Hugging Face Space image (clones main from GitHub, SQLite, port 7860)
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t vel-hf deploy/huggingface
          docker run -d --name vel-hf -p 7860:7860 vel-hf
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7860/api/health && break; sleep 1; done
          bash scripts/smoke-container.sh http://127.0.0.1:7860
      - name: Container log on failure
        if: failure()
        run: |
          docker logs vel | tail -100
          docker logs vel-hf 2>/dev/null | tail -100 || true
